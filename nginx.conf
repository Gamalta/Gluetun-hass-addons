# SNI / Host proxy: forwards incoming HTTPS (by TLS SNI) and HTTP (by Host
# header) connections to the requested host, through the VPN. Names are
# resolved by Gluetun's own DNS server on 127.0.0.1.
# Only the networks of the 'sni_proxy_allowed_networks' option may use it:
# run.sh writes them as 'allow' rules to allowed_networks.conf at startup.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;

worker_processes 1;

events {}

stream {
  resolver 127.0.0.1 ipv6=off valid=60s;

  log_format sni '$remote_addr -> $ssl_preread_server_name ($status)';
  access_log /dev/stdout sni;

  server {
    listen 443;
    listen [::]:443;

    include /etc/nginx/allowed_networks.conf;
    deny  all;

    ssl_preread on;
    proxy_pass $ssl_preread_server_name:443;
  }
}

http {
  resolver 127.0.0.1 ipv6=off;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  server {
    listen 80;
    listen [::]:80;

    include /etc/nginx/allowed_networks.conf;
    deny  all;

    location / {
      proxy_pass http://$host$request_uri;
      proxy_set_header Host $host;
    }
  }
}
